name: Assemble release download
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: assemble-v0-23-0
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.23.0
      MANIFEST_NAME: JudoCeremony-0.23.0-win-x64.zip.parts.json
      EXPECTED_SHA256: 5b18255715ff1333de22383c8c1fdc7aa379cec589ec2bcbd8a389bb0850309e
    steps:
      - name: Check draft, download verified parts and assemble ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,re,subprocess,hashlib,pathlib,http.client,urllib.parse
          repo=os.environ['GITHUB_REPOSITORY']; tag=os.environ['RELEASE_TAG']
          manifest=os.environ['MANIFEST_NAME']; expected=os.environ['EXPECTED_SHA256']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag)
          filename='JudoCeremony-'+tag[1:]+'-win-x64.zip'
          assert manifest==filename+'.parts.json'
          assert re.fullmatch('[a-f0-9]{64}',expected)
          def gh(*args): return subprocess.check_output(['gh',*args],text=True)
          endpoint='repos/'+repo+'/releases/433716500'
          release=json.loads(gh('api',endpoint))
          assert release['draft'] and release['id']==433716500, 'Assembly is permitted only for the approved v0.23.0 draft.'
          assets={a['name']:a for a in json.loads(gh('api',endpoint+'/assets?per_page=100'))}
          pathlib.Path('parts').mkdir()
          def download(name):
              asset=assets[name]
              with pathlib.Path('parts',name).open('wb') as output:
                  subprocess.run(['gh','api','repos/'+repo+'/releases/assets/'+str(asset['id']),'-H','Accept: application/octet-stream'],stdout=output,check=True)
          download(manifest)
          doc=json.loads(pathlib.Path('parts',manifest).read_text())
          assert doc['filename']==filename and doc['sha256']==expected and 1<=len(doc['parts'])<=128
          names=[p['name'] for p in doc['parts']]
          assert len(names)==len(set(names))
          assert all(re.fullmatch(re.escape(filename)+r'\.part-[0-9]{3}',p) for p in names)
          for name in names: download(name)
          digest=hashlib.sha256(); total=0
          with open(filename,'wb') as output:
              for part in doc['parts']:
                  path=pathlib.Path('parts',part['name'])
                  assert path.stat().st_size==part['bytes']
                  assert hashlib.file_digest(path.open('rb'),'sha256').hexdigest()==part['sha256']
                  with path.open('rb') as stream:
                      while block:=stream.read(1024*1024):
                          output.write(block); digest.update(block); total+=len(block)
          assert digest.hexdigest()==expected and total==doc['bytes']
          release=json.loads(gh('api',endpoint))
          assert release['draft'] and release['id']==433716500
          existing=next((a for a in release['assets'] if a['name']==filename),None)
          if existing:
              assert existing['digest']=='sha256:'+expected and existing['size']==total
          else:
              target=urllib.parse.urlparse(release['upload_url'].split('{')[0])
              assert target.scheme=='https' and target.hostname=='uploads.github.com'
              connection=http.client.HTTPSConnection(target.hostname,timeout=300)
              connection.putrequest('POST',target.path+'?name='+urllib.parse.quote(filename))
              connection.putheader('Authorization','Bearer '+os.environ['GH_TOKEN'])
              connection.putheader('User-Agent','Judo-Release-Assembly')
              connection.putheader('Content-Type','application/zip');connection.putheader('Content-Length',str(total));connection.endheaders()
              with open(filename,'rb') as stream:
                  while block:=stream.read(1024*1024): connection.send(block)
              response=connection.getresponse(); result=json.loads(response.read());connection.close()
              assert response.status==201, result.get('message','Upload failed')
          asset=next(a for a in json.loads(gh('api',endpoint+'/assets?per_page=100')) if a['name']==filename)
          assert asset['digest']=='sha256:'+expected and asset['size']==total
          print('Assembled release ZIP matches all part hashes and the expected full SHA-256.')
          PY
